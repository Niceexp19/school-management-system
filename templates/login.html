<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduManage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #0f2b3d, #1e4a76);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-card {
            background: white;
            border-radius: 2rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
        }
        .login-logo h1 span { color: #2563eb; }
        .login-logo p {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.4rem;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 1rem;
            background: #f8fafc;
            color: #0f172a;
            transition: 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0f2b3d, #1e4a76);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15,43,61,0.3);
        }
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .demo-info {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .demo-info h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.8rem;
        }
        .demo-item {
            font-size: 0.8rem;
            color: #475569;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }
        .demo-item span {
            font-weight: 700;
            color: #0f172a;
            font-family: monospace;
            background: white;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <h1>🏫 Edu<span>Manage</span></h1>
        <p>School Management System</p>
    </div>

    {% if message %}
    <div class="alert-error">❌ {{ message }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" placeholder="Enter your username" required class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" placeholder="Enter your password" required class="form-control">
        </div>
        <button type="submit" class="btn-login">🚀 Login to Dashboard</button>
    </form>

    <div class="demo-info">
        <h4>🎯 Demo Credentials:</h4>
        <div class="demo-item">
            👑 Admin: <span>admin</span> / <span>admin123</span>
        </div>
        <div class="demo-item">
            👨‍🏫 Teacher: <span>teacher1</span> / <span>teacher123</span>
        </div>
    </div>
</div>

<a href="/" class="back-link">← Back to Home</a>

</body>
</html>
